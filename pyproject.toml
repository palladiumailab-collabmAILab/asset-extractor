[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-extractor"
dynamic = ["version"]
description = "Authorized local APK/OBB/NPK compatibility asset extraction automation"
requires-python = ">=3.13"

[project.scripts]
asset-extractor = "asset_extractor.cli:main"

[tool.setuptools]
package-dir = {"" = "programs/src"}

[tool.setuptools.packages.find]
where = ["programs/src"]

[tool.setuptools.dynamic]
version = {attr = "asset_extractor.__version__"}

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["programs/legacy", "programs/vendor"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
files = ["programs/src/asset_extractor", "programs/runtime_artifacts.py"]
