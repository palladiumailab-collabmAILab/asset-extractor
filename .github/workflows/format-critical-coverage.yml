name: Format critical coverage files

on:
  push:
    branches:
      - codex/issue-12-critical-coverage

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/issue-12-critical-coverage
      - name: Format coverage gate files
        run: |
          python -m pip install --disable-pip-version-check ruff==0.8.4
          ruff format scripts/check-critical-coverage.py development/tests/test_critical_coverage_gate.py
          rm .github/workflows/format-critical-coverage.yml
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-critical-coverage.py development/tests/test_critical_coverage_gate.py .github/workflows/format-critical-coverage.yml
          git diff --cached --check
          git commit -m 'style: format critical coverage gate'
          git push origin HEAD:codex/issue-12-critical-coverage
