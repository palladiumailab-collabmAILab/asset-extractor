name: Format test backends

on:
  push:
    branches:
      - codex/issue-12-test-import-cleanup

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/issue-12-test-import-cleanup
      - name: Format affected test
        run: |
          python -m pip install --disable-pip-version-check ruff==0.8.4
          ruff format development/tests/test_backends.py
          rm .github/workflows/format-test-backends.yml
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add development/tests/test_backends.py .github/workflows/format-test-backends.yml
          git diff --cached --check
          git commit -m 'style: format backend tests after import cleanup'
          git push origin HEAD:codex/issue-12-test-import-cleanup
