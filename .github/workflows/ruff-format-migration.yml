name: One-time Ruff format migration

on:
  push:
    branches:
      - chore/ruff-format-baseline
  pull_request:
    branches:
      - codex/asset-extraction-automation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out formatting branch
        uses: actions/checkout@v6
        with:
          ref: chore/ruff-format-baseline

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.8.4

      - name: Format maintained Python
        run: ruff format programs scripts development/tests

      - name: Commit formatting-only changes
        run: |
          git diff --check
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs scripts development/tests
          git commit -m 'style: apply Ruff format baseline'
          git push origin HEAD:chore/ruff-format-baseline
