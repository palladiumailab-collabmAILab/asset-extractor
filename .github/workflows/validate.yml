name: Validate harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate repository invariants
        run: |
          test "$(wc -c < AGENTS.md)" -le 32768
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          test -f docs/specs/README.md
          test -f skills/long-running-work/SKILL.md
          test -f skills/self-improvement/SKILL.md

      - name: Validate hook
        run: |
          test "$(git ls-files -s -- .githooks/pre-commit | awk '{print $1}')" = '100755'
          bash -n .githooks/pre-commit
          bash tests/test-pre-commit.sh

      - name: Build canonical validation image
        run: docker build --tag asset-extractor-validation .

      - name: Run canonical validation path
        run: docker run --rm asset-extractor-validation
