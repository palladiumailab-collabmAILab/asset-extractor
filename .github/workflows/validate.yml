name: Validate harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate skills
        run: python scripts/validate-skills.py skills

      - name: Validate repository invariants
        run: |
          test "$(wc -c < AGENTS.md)" -le 32768
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Run asset extractor tests with branch coverage
        run: |
          coverage run --branch -m unittest discover -s development/tests -t .
          coverage report --fail-under=55

      - name: Run Ruff static checks
        run: >-
          git ls-files -z -- '*.py'
          ':(exclude)programs/legacy/**'
          ':(exclude)programs/vendor/**'
          | xargs -0 ruff check

      - name: Validate JSON-Schema contracts
        run: >-
          python scripts/validate-schemas.py
          --manifest visual-reference-evidence=development/config/character-asset-evidence-20260914.json

      - name: Validate hook
        run: |
          test "$(git ls-files -s -- .githooks/pre-commit | awk '{print $1}')" = '100755'
          bash -n .githooks/pre-commit
          bash tests/test-pre-commit.sh
